name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

env:
  # gid version this repository's packages depend on (see gidgen.json). The published DUB
  # package zip provides the defs/ and gir/ of the gid dependency; gidgen itself is checked
  # out from its own repository below. No local sibling checkout of gid is needed.
  GID_VERSION: "0.9.16"

jobs:
  build:
    name: Generate and Build
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - name: Install Git and D toolchain
        run: |
          dnf install -y git ldc dub glib2-devel make pkg-config gobject-introspection-devel unzip

      - name: Checkout gid_apache
        uses: actions/checkout@v4
        with:
          path: gid_apache

      - name: Checkout gidgen
        uses: actions/checkout@v4
        with:
          repository: Kymorphia/gidgen
          path: gidgen

      - name: Fetch the published gid package as the ../gid sibling
        run: |
          curl -sL "https://code.dlang.org/packages/gid/${{ env.GID_VERSION }}.zip" -o gid.zip
          unzip -q gid.zip -d "${{ github.workspace }}"
          mv "${{ github.workspace }}/gid-${{ env.GID_VERSION }}" "${{ github.workspace }}/gid"

      - name: Generate bindings
        working-directory: gid_apache
        run: |
          git config --global --add safe.directory '*'
          dub run --root=../gidgen --compiler=ldc2 gidgen -- --config "${{ github.workspace }}/gid_apache/gidgen.json" --report --report-file report.txt

      - name: Check generated files are up to date
        working-directory: gid_apache
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"

      - name: Build packages (gid from the DUB registry)
        working-directory: gid_apache
        run: dub build --parallel --compiler=ldc2 --debug debug

      - name: Test
        working-directory: gid_apache
        run: dub test --compiler=ldc2
