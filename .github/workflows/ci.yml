name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

env:
  # Ref of the gid repository providing the defs, GIRs, gidgen and the packages this repository depends on.
  # Use the release tag matching the dependency version in gidgen.json once gid has a release which includes
  # support for dependency repositories in gidgen.
  GID_REF: main
  GID_LOCAL_VERSION: "0.9.15"

jobs:
  build:
    name: Generate and Build
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - name: Install Git
        run: dnf install -y git

      - name: Checkout gid_apache
        uses: actions/checkout@v4
        with:
          path: gid_apache

      - name: Checkout gid as a sibling
        uses: actions/checkout@v4
        with:
          repository: Kymorphia/gid
          ref: ${{ env.GID_REF }}
          path: gid
          submodules: true

      - name: Install dependencies
        run: |
          dnf install -y gcc-gdc ldc dub glib2-devel make pkg-config gobject-introspection-devel

      - name: Generate bindings
        working-directory: gid_apache
        run: |
          git config --global --add safe.directory '*'
          make binding

      - name: Check generated files are up to date
        working-directory: gid_apache
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"

      - name: Make packages
        working-directory: gid_apache
        run: make packages GID_LOCAL_VERSION=${{ env.GID_LOCAL_VERSION }}
